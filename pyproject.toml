[project]
name = "es-steward"
version = "0.1.0a1"
description = "Steward: Elasticsearch index hygiene CLI"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Aaron Mildenstein", email = "aaron@mildensteins.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
requires-python = ">=3.11"
dependencies = [
    "es-mgmt[cli]==0.1.0a1",
    "pyyaml>=6.0",
]

[project.scripts]
es-steward = "es_steward.cli:main"
es-steward-mcp = "es_steward.mcp_server:main"

[project.optional-dependencies]
tui = ["rich>=13", "textual==8.2.8"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
mcp = ["mcp>=2.1", "httpx>=0.27"]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.8",
    "rich>=13",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "mcp>=2.1",
    "textual==8.2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/es_steward"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88
